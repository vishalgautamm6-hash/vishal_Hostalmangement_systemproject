<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCODE</title>
    <link rel="stylesheet" href="p5.css">  <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />

</head>

<body>

    <img 
        class="image-gradient" 
        src="wwvishalwww/card1img (1).jpeg" 
        alt="gradient"
    >

    <div class="layer-blur"></div>

    <div class="container">

        <header>
            <h1 data-aos="fade-down" data-aos-duration="1500" class="logo">MCODE</h1>

            <nav>
                <a data-aos="fade-down" data-aos-duration="1500"  href="#">COMPANY</a>
                <a data-aos="fade-down" data-aos-duration="2000"  href="#">FEATURES</a>
                <a data-aos="fade-down" data-aos-duration="2500"  href="#">RESOURCES</a>
                <a data-aos="fade-down" data-aos-duration="3000"  href="#">DOCS</a>
            </nav>

            <button data-aos="fade-down" data-aos-duration="1500" data-aos="fade-down" data-aos-duration="1500" class="btn-signing">SIGN IN</button>
        </header>

        <main>

            <div class="content">

                <div data-aos="fade-right"
                 data-aos-offset="300"
                data-aos-easing="ease-in-sine" data-aos="fade-down" data-aos-duration="1500"  class="tag-box">


                    <div class="tag">
                        INTRODUCING &wedbar;
                    </div>
                </div>

                <h1 data-aos="fade-right"
                 data-aos-offset="300"
                data-aos-easing="ease-in-sine" data-aos="fade-down" data-aos-duration="2000" >
                    EMAIL FOR<br>
                    DEVELOPERS
                </h1>

                <p data-aos="fade-right"
                 data-aos-offset="300"
                data-aos-easing="ease-in-sine" data-aos="fade-down" data-aos-duration="2500" >
                    The best way to reach humans instead of spam folders,
                    delivering transactional and marketing emails at scale.
                </p>

                <div data-aos="fade-right"
                 data-aos-offset="300"
                data-aos-easing="ease-in-sine" data-aos="fade-down" data-aos-duration="3000"  class="buttons">

                    <a href="#" class="btn-get-started">
                        Documentation &gt;
                    </a>

                    <a href="#" class="btn-get-signing-main">
                        Get Started &gt;
                    </a>

                </div>

            </div>

        </main>
    <spline-viewer  data-aos="fade-right"
                 data-aos-offset="300"
                data-aos-easing="ease-in-sine" data-aos="fade-down" data-aos-duration="3000"    class="animation-3D"  url="https://prod.spline.design/N1H814Pc6m7qZ4Uv/scene.splinecode"></spline-viewer>

    </div>

<script type="module" src="https://cdn.spline.design/@splinetool/viewer@2.0.36/build/spline-viewer.js"></script>

  <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
  <script>
    AOS.init();
  </script>


</body>
</html>
